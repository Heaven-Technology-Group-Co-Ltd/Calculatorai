name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check web
        run: pnpm type-check

      - name: Lint web
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build web
        run: pnpm build

      - name: Type-check discord-bot
        run: pnpm --dir discord-bot exec tsc --noEmit

      - name: Test discord-bot signer
        run: pnpm --dir discord-bot test
